# Cross-compilation linker used by `ci/build.sh package`.
#
# The Jenkins ARM64 Linux agent builds x86_64 Linux through cargo-zigbuild;
# configuring a target linker here would bypass Zig's glibc-2.31 selection.
# Windows GNU remains an ordinary Cargo cross build through mingw-w64:
#   sudo apt-get install gcc-mingw-w64-x86-64
#   rustup target add x86_64-pc-windows-gnu
#
# macOS artifacts should be built on a macOS Jenkins agent with Xcode CLT.

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
