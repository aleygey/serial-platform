# Jenkins is the only release builder and publisher. This workflow is a
# non-publishing native portability check for development branches.
name: Release validation (non-publishing)

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/serial-desktop/package-lock.json

      - name: Verify locked Rust workspace
        run: cargo metadata --locked --no-deps --format-version 1

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Build native Rust programs
        run: cargo build --release --locked -p serial-cli -p seriald -p serialctl -p serial-mcp

      - name: Install locked desktop dependencies
        working-directory: crates/serial-desktop
        run: npm ci --no-audit --no-fund

      - name: Type-check, test, and build Electron desktop
        working-directory: crates/serial-desktop
        run: npm run build

      - name: Package native Electron desktop with sidecars
        shell: bash
        run: |
          set -Eeuo pipefail
          destination="target/desktop-validation"
          mkdir -p "${destination}"
          case "${RUNNER_OS}" in
            Linux)
              bash ci/electron.sh package linux x86_64 target/release "${destination}"
              test -x "${destination}/Serial Platform.AppImage"
              ;;
            Windows)
              bash ci/electron.sh package windows x86_64 target/release "${destination}"
              test -f "${destination}/Serial Platform.exe"
              ;;
            macOS)
              case "$(uname -m)" in
                arm64) electron_architecture=arm64 ;;
                x86_64) electron_architecture=x86_64 ;;
                *) echo "unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              bash ci/electron.sh package \
                macos "${electron_architecture}" target/release "${destination}"
              test -x "${destination}/Serial Platform.app/Contents/MacOS/Serial Platform"
              ;;
            *)
              echo "unsupported runner OS: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac
